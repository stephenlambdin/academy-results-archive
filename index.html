<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Archive | USATKD National Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --black:#000000; --gold:#C3A141; --hi:#ECBE43; --white:#FFFFFF; --paper:#F5F3EE; --line:#DDD6C8; --faint:#F0EBDF; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Montserrat','Helvetica Neue',Arial,sans-serif; background:var(--paper); color:var(--black); }
  .bebas { font-family:'Bebas Neue','Arial Narrow',sans-serif; letter-spacing:0.04em; }
  header { background:var(--black); color:var(--white); }
  .wrap { max-width:920px; margin:0 auto; padding:0 16px; }
  .head-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:20px 0 14px; }
  .head-row img { width:84px; height:84px; }
  .eyebrow { color:var(--gold); font-size:10px; font-weight:700; letter-spacing:0.28em; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:44px; line-height:1; letter-spacing:0.04em; margin-top:2px; }
  h1 span { color:var(--hi); }
  .sub { font-size:11px; color:#BBB; margin-top:2px; }
  .stats { display:flex; gap:20px; margin-left:auto; text-align:right; }
  .stat b { display:block; font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; color:var(--hi); font-weight:400; }
  .stat small { font-size:9px; letter-spacing:0.2em; color:#999; text-transform:uppercase; }
  .rule { height:3px; background:linear-gradient(90deg,var(--gold),var(--hi)); }
  nav { display:flex; gap:4px; }
  nav button { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.04em; padding:8px 16px; border:none; cursor:pointer; background:transparent; color:#CCC; }
  nav button.on { background:var(--hi); color:var(--black); }
  main { padding:24px 0 48px; }
  input[type=search] { width:100%; font:inherit; font-size:15px; padding:12px 16px; background:var(--white); border:2px solid var(--black); border-radius:6px; }
  .hint { font-size:13px; color:#555; margin-top:20px; }
  .card { background:var(--white); border:1px solid var(--line); border-radius:6px; margin-top:16px; overflow:hidden; }
  .card-head { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:2px solid var(--hi); }
  .aname { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.04em; }
  .noc { font-size:10px; font-weight:700; background:var(--black); color:var(--hi); border-radius:3px; padding:2px 6px; vertical-align:middle; }
  .count { font-size:11px; color:#888; }
  .rowbtn { width:100%; text-align:left; background:none; border:none; font:inherit; cursor:pointer; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .rowbtn:hover { background:#FBF9F4; }
  .ev-name { font-size:13px; font-weight:600; }
  .ev-meta { font-size:11px; color:#777; }
  .chip { font-size:10px; font-weight:700; letter-spacing:0.12em; padding:3px 8px; border-radius:3px; white-space:nowrap; min-width:82px; text-align:center; flex:none; align-self:center; box-sizing:border-box; }
  .chip.g { background:var(--hi); color:var(--black); border:1px solid var(--hi); }
  .chip.s { background:var(--white); color:var(--black); border:1px solid var(--black); }
  .chip.b { color:var(--gold); border:1px solid var(--gold); }
  .chip.c { color:#999; border:1px solid transparent; }
  .divline { border-top:1px solid var(--faint); }
  .matchlog { background:#FBF9F4; border-top:1px solid var(--faint); padding:8px 16px 12px; }
  .matchlog h4 { font-size:10px; letter-spacing:0.18em; color:#8A7430; text-transform:uppercase; margin:6px 0; }
  table.matches { width:100%; border-collapse:collapse; font-size:12px; }
  table.matches td { padding:5px 8px 5px 0; border-bottom:1px solid var(--faint); vertical-align:top; }
  table.matches tr:last-child td { border-bottom:none; }
  td.rnd { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:0.06em; width:44px; color:#444; }
  td.res { width:34px; font-weight:700; }
  td.res.w { color:#8A7430; } td.res.l { color:#999; }
  td.score { width:90px; color:#555; white-space:nowrap; }
  .empty { font-size:12px; color:#999; padding:6px 0; }
  .divhead { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.04em; }
  .grid { display:grid; gap:8px; grid-template-columns:1fr; padding:12px 16px; }
  @media(min-width:640px){ .grid { grid-template-columns:1fr 1fr; } }
  .divcard { border:1px solid #E5DFD2; border-radius:4px; }
  .divbody { border-top:1px solid var(--faint); padding:8px 12px; font-size:13px; max-height:340px; overflow-y:auto; }
  .divbody li { list-style:none; display:grid; grid-template-columns:minmax(0,1fr) 44px auto; align-items:center; column-gap:8px; padding:3px 0; }
  .divbody li .who { display:flex; align-items:center; gap:6px; min-width:0; }
  .divbody li .noc { justify-self:center; }
  .pline { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
  .pline .noc { flex:none; }
  .defw { color:#999; font-size:11px; flex:none; }
  td.score { text-align:right; }
  .divbody .sec { font-size:10px; letter-spacing:0.18em; color:#8A7430; text-transform:uppercase; margin:8px 0 4px; }
  details.entries summary { font-size:11px; color:#7A6420; cursor:pointer; margin-top:8px; }
  .toolbar { display:flex; justify-content:flex-end; margin-top:4px; }
  .toolbar a, .toolbar button { font-size:12px; font-weight:600; color:#7A6420; text-decoration:underline; background:none; border:none; cursor:pointer; font-family:inherit; }
  .error { background:var(--white); border:2px solid var(--black); border-left:6px solid var(--gold); border-radius:6px; padding:16px; font-size:13px; margin-top:16px; }
  .pic { width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); flex:none; object-fit:cover; }
  .pic.sm { width:22px; height:22px; border-width:1px; vertical-align:middle; margin-right:6px; }
  .namewrap { display:flex; align-items:center; gap:10px; }
  .error code { background:var(--faint); padding:1px 4px; border-radius:3px; }
  .loading { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--gold); letter-spacing:0.08em; padding:24px 0; }
  footer { background:var(--black); color:#AAA; margin-top:40px; }
  footer .wrap { padding:14px 16px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; }
  .filters { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .filters button { font:inherit; font-size:11px; font-weight:600; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--white); cursor:pointer; }
  .filters button.on { background:var(--black); color:var(--hi); border-color:var(--black); }
  .yearbar { width:100%; display:flex; align-items:center; gap:12px; margin-top:20px; padding:8px 16px; background:var(--black); color:var(--white); border:none; border-left:6px solid var(--hi); border-radius:4px; cursor:pointer; font-family:inherit; }
  .yearbar:first-of-type { margin-top:12px; }
  .yeartxt { font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; letter-spacing:0.06em; color:var(--hi); }
  .yearbar .count { color:#AAA; }
  .yearbar .tog { margin-left:auto; font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--hi); }
</style>
</head>

<script>
/* ================================================================
   CONFIG: paste your Google Sheet ID between the quotes below.
   The ID is the long string in the sheet URL:
   docs.google.com/spreadsheets/d/  THIS PART  /edit
   The sheet must be shared as "Anyone with the link: Viewer".
   ================================================================ */
const SHEET_ID = "16--LTisSbdw9xpA-dTtN40EiEaf5_bdmjQHI2Czf6Lg";

/* Folder in this repo that holds Academy athlete headshots.
   Filenames are listed in the sheet's Roster tab. */
const PHOTO_BASE = "photos/";

/* ---------------- data loading (gviz JSON) ---------------- */
async function loadTab(name) {
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(name) + "&t=" + Date.now();
  const res = await fetch(url);
  if (!res.ok) throw new Error("Could not reach the sheet (HTTP " + res.status + ")");
  const text = await res.text();
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start === -1) throw new Error("Unexpected response for tab " + name);
  const j = JSON.parse(text.slice(start, end + 1));
  if (j.status === "error") throw new Error("Sheet error on tab " + name + ": " + (j.errors && j.errors[0] && j.errors[0].detail_message || ""));
  const labels = j.table.cols.map(c => (c.label || "").trim());
  return j.table.rows.map(r => {
    const o = {};
    r.c.forEach((cell, i) => {
      let v = cell ? cell.v : "";
      if (typeof v === "string" && /^Date\(/.test(v)) {
        const m = v.match(/Date\((\d+),(\d+),(\d+)/);
        v = m ? m[1] + "-" + String(+m[2] + 1).padStart(2, "0") + "-" + String(+m[3]).padStart(2, "0") : (cell.f || v);
      }
      if (v === null || v === undefined) v = "";
      o[labels[i]] = v;
    });
    return o;
  }).filter(o => Object.values(o).some(v => String(v).trim() !== ""));
}

const S = v => String(v == null ? "" : v).trim();
const KEY = (n, c) => S(n).toUpperCase() + "|" + S(c).toUpperCase();
const ROUND_ORDER = { R256:0, R128:1, R64:2, R32:3, R16:4, QF:5, SF:6, F:7 };
const roundRank = r => ROUND_ORDER[S(r).toUpperCase()] ?? 99;

function fmtDate(d) {
  d = S(d);
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  const opts = { month: "long", day: "numeric" };
  if (dt.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return dt.toLocaleDateString("en-US", opts);
}
function flip(score) {
  const parts = S(score).split(":");
  return parts.length === 2 ? parts[1].trim() + ":" + parts[0].trim() : S(score);
}
function esc(s) { return S(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch])); }
function chip(p) {
  p = Number(p);
  if (p === 1) return '<span class="chip g">GOLD</span>';
  if (p === 2) return '<span class="chip s">SILVER</span>';
  if (p === 3) return '<span class="chip b">BRONZE</span>';
  return '<span class="chip c">COMPETED</span>';
}

function tokens(s) { return S(s).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean); }
function photoFor(name, noc) {
  if (!DB || !DB.roster) return null;
  const nt = tokens(name), nu = S(noc).toUpperCase();
  for (const r of DB.roster) {
    if (S(r["NOC"]).toUpperCase() !== nu || !S(r["Photo"])) continue;
    const rt = tokens(r["Display Name"]);
    if (rt.length >= 2 && rt.every(t => nt.includes(t))) return PHOTO_BASE + S(r["Photo"]);
  }
  return null;
}
function pic(name, noc, small) {
  const p = photoFor(name, noc);
  return p ? '<img class="pic' + (small ? " sm" : "") + '" src="' + esc(p) + '" alt="" loading="lazy" onerror="this.remove()">' : "";
}

/* ---------------- de-duplication ----------------
   Two coaches pasting the same event must not double entries.
   Events are merged when EventID matches OR name plus date match;
   Results and Matches rows are then collapsed on their natural keys. */
function dedupe(events, results, matches) {
  const canon = {};            // any EventID -> canonical EventID
  const seenEv = new Map();    // "name|date" -> canonical EventID
  const keptEvents = [];
  events.forEach(e => {
    const id = S(e["EventID"]);
    const nk = S(e["Event Name"]).toUpperCase().replace(/\s+/g, " ") + "|" + S(e["Start Date"]);
    if (canon[id]) return;                       // exact duplicate EventID row
    if (seenEv.has(nk)) { canon[id] = seenEv.get(nk); return; }  // same event, different ID
    canon[id] = id; seenEv.set(nk, id); keptEvents.push(e);
  });
  const cid = id => canon[S(id)] || S(id);
  const seenR = new Map();
  results.forEach(r => {
    const k = cid(r["EventID"]) + "|" + S(r["Division"]).toUpperCase() + "|" + KEY(r["Athlete"], r["NOC"]);
    const prev = seenR.get(k);
    if (!prev || (!S(prev["Placement"]) && S(r["Placement"]))) seenR.set(k, r);  // prefer the row that carries a placement
  });
  const seenM = new Map();
  matches.forEach(m => {
    const k = cid(m["EventID"]) + "|" + S(m["Division"]).toUpperCase() + "|" + S(m["Round"]).toUpperCase() +
              "|" + KEY(m["Winner"], m["Winner NOC"]) + "|" + KEY(m["Loser"], m["Loser NOC"]);
    if (!seenM.has(k)) seenM.set(k, m);
  });
  const fix = rows => rows.map(r => Object.assign({}, r, { EventID: cid(r["EventID"]) }));
  return { events: keptEvents, results: fix([...seenR.values()]), matches: fix([...seenM.values()]) };
}

/* ---------------- state ---------------- */
let DB = null;
let tab = "search";
let query = "";
let openKeys = new Set();
let closedYears = new Set();
let yearsInitialized = false;

async function boot() {
  try {
    const [events, results, matches, roster] = await Promise.all([
      loadTab("Events"), loadTab("Results"), loadTab("Matches"),
      loadTab("Roster").catch(() => []),
    ]);
    const d = dedupe(events, results, matches);
    const evById = {};
    d.events.forEach(e => { evById[S(e["EventID"])] = e; });
    DB = { events: d.events, results: d.results, matches: d.matches, roster, evById };
    renderStats();
    render();
  } catch (err) {
    document.getElementById("app").innerHTML =
      '<div class="error"><b>Could not load the archive.</b><br>' + esc(err.message) +
      '<br><br>Checklist: the Sheet ID is pasted into <code>SHEET_ID</code> in index.html, the sheet is shared as ' +
      '"Anyone with the link: Viewer", and the tabs are named exactly <code>Events</code>, <code>Results</code>, and <code>Matches</code>.</div>';
  }
}

function renderStats() {
  const names = new Set(DB.results.map(r => KEY(r["Athlete"], r["NOC"])));
  document.getElementById("stats").innerHTML =
    [["Events", DB.events.length], ["Athletes", names.size], ["Results", DB.results.length]]
      .map(([l, v]) => '<div class="stat"><b>' + v + "</b><small>" + l + "</small></div>").join("");
}

/* ---------------- athlete search ---------------- */
function athleteMatches(name, noc, eventId, division) {
  const mine = DB.matches.filter(m =>
    S(m["EventID"]) === eventId && S(m["Division"]) === division &&
    (KEY(m["Winner"], m["Winner NOC"]) === KEY(name, noc) || KEY(m["Loser"], m["Loser NOC"]) === KEY(name, noc))
  );
  mine.sort((a, b) => roundRank(a["Round"]) - roundRank(b["Round"]));
  return mine.map(m => {
    const won = KEY(m["Winner"], m["Winner NOC"]) === KEY(name, noc);
    return {
      round: S(m["Round"]).toUpperCase(),
      won,
      opp: won ? S(m["Loser"]) : S(m["Winner"]),
      oppNoc: won ? S(m["Loser NOC"]) : S(m["Winner NOC"]),
      method: S(m["Method"]).toUpperCase(),
      score: won ? S(m["Score"]) : flip(m["Score"]),
    };
  });
}

function renderSearch() {
  let html = '<input type="search" id="q" placeholder="Search by athlete name or country code (PARK, or USA)" value="' + esc(query) + '">';
  const q = query.trim().toUpperCase();
  if (q.length < 2) {
    html += '<p class="hint">Type at least two letters of a name. Every competitor in the archive is searchable, medalists and non-medalists alike. Open an event under an athlete to see their full match log.</p>';
  } else {
    const map = new Map();
    DB.results.forEach(r => {
      const n = S(r["Athlete"]), c = S(r["NOC"]);
      if (n.toUpperCase().includes(q) || c.toUpperCase() === q) {
        const k = KEY(n, c);
        if (!map.has(k)) map.set(k, { name: n, noc: c, rows: [] });
        map.get(k).rows.push(r);
      }
    });
    const list = [...map.values()].slice(0, 50);
    list.sort((a, b) => a.name.localeCompare(b.name));
    if (!list.length) html += '<p class="hint">No athletes match "' + esc(query) + '". Check the spelling as printed on the draw sheet, or add more event results to the sheet.</p>';
    list.forEach(a => {
      a.rows.sort((x, y) => S(DB.evById[S(y["EventID"])] && DB.evById[S(y["EventID"])]["Start Date"]).localeCompare(S(DB.evById[S(x["EventID"])] && DB.evById[S(x["EventID"])]["Start Date"])));
      html += '<div class="card"><div class="card-head"><div class="namewrap">' + pic(a.name, a.noc) +
              '<div><span class="aname">' + esc(a.name) + '</span> <span class="noc">' + esc(a.noc) + '</span></div></div>' +
              '<span class="count">' + a.rows.length + " result" + (a.rows.length !== 1 ? "s" : "") + "</span></div>";
      a.rows.forEach(r => {
        const evId = S(r["EventID"]), div = S(r["Division"]);
        const ev = DB.evById[evId] || {};
        const k = KEY(a.name, a.noc) + "@" + evId + "@" + div;
        const open = openKeys.has(k);
        html += '<div class="divline"><button class="rowbtn" data-toggle="' + esc(k) + '">' +
                '<span><span class="ev-name">' + esc(ev["Event Name"] || evId) + '</span><br>' +
                '<span class="ev-meta">' + esc(fmtDate(ev["Start Date"])) + " · " + esc(div) + (ev["Level"] ? " · " + esc(ev["Level"]) : "") + "</span></span>" +
                chip(r["Placement"]) + "</button>";
        if (open) {
          const log = athleteMatches(a.name, a.noc, evId, div);
          html += '<div class="matchlog"><h4>Match log</h4>';
          if (!log.length) {
            html += '<p class="empty">No match data loaded for this division yet. Run the event PDF through the import workflow to add it.</p>';
          } else {
            html += '<table class="matches">' + log.map(m =>
              "<tr><td class=\"rnd\">" + esc(m.round) + "</td>" +
              '<td class="res ' + (m.won ? "w\">W" : "l\">L") + "</td>" +
              '<td><div class="pline"><span class="defw">' + (m.won ? "def." : "lost to") + "</span> " + esc(m.opp) + ' <span class="noc">' + esc(m.oppNoc) + "</span></div></td>" +
              '<td class="score">' + esc(m.method) + " " + esc(m.score) + "</td></tr>"
            ).join("") + "</table>";
          }
          html += "</div>";
        }
        html += "</div>";
      });
      html += "</div>";
    });
  }
  return html;
}

/* ---------------- events browser ---------------- */
function renderEvents() {
  let html = '<div class="toolbar"><a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '" target="_blank" rel="noopener">Open the source sheet</a></div>';
  const evs = [...DB.events].sort((a, b) => S(b["Start Date"]).localeCompare(S(a["Start Date"])));
  const byYear = new Map();
  evs.forEach(ev => {
    const y = S(ev["Start Date"]).slice(0, 4) || "Undated";
    if (!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(ev);
  });
  const years = [...byYear.keys()];
  if (!yearsInitialized) {          // first visit: newest year open, older years collapsed
    years.slice(1).forEach(y => closedYears.add(y));
    yearsInitialized = true;
  }
  years.forEach(year => {
    const group = byYear.get(year);
    const closed = closedYears.has(year);
    html += '<button class="yearbar" data-ytoggle="' + esc(year) + '"><span class="yeartxt">' + esc(year) + '</span>' +
            '<span class="count">' + group.length + " event" + (group.length !== 1 ? "s" : "") + '</span>' +
            '<span class="tog">' + (closed ? "+" : "–") + "</span></button>";
    if (closed) return;
    group.forEach(ev => renderEventCard(ev));
  });
  function renderEventCard(ev) {
    const evId = S(ev["EventID"]);
    const divs = [...new Set(DB.results.filter(r => S(r["EventID"]) === evId).map(r => S(r["Division"])))];
    const k = "ev@" + evId;
    const open = openKeys.has(k);
    html += '<div class="card"><button class="rowbtn" data-toggle="' + esc(k) + '">' +
            '<span><span class="ev-name">' + esc(ev["Event Name"]) + '</span><br><span class="ev-meta">' +
            esc(fmtDate(ev["Start Date"])) + (ev["Location"] ? " · " + esc(ev["Location"]) : "") + (ev["Level"] ? " · " + esc(ev["Level"]) : "") +
            " · " + divs.length + ' divisions</span></span><span class="divhead" style="color:var(--gold)">' + (open ? "–" : "+") + "</span></button>";
    if (open) {
      html += '<div class="grid" style="border-top:2px solid var(--hi)">';
      divs.forEach(div => {
        const rows = DB.results.filter(r => S(r["EventID"]) === evId && S(r["Division"]) === div);
        const medals = rows.filter(r => Number(r["Placement"]) >= 1).sort((a, b) => Number(a["Placement"]) - Number(b["Placement"]));
        const dk = "dv@" + evId + "@" + div;
        const dopen = openKeys.has(dk);
        html += '<div class="divcard"><button class="rowbtn" data-toggle="' + esc(dk) + '">' +
                '<span class="divhead">' + esc(div.toUpperCase()) + '</span><span class="count">' + rows.length + " competitors</span></button>";
        if (dopen) {
          const mts = DB.matches.filter(m => S(m["EventID"]) === evId && S(m["Division"]) === div)
            .sort((a, b) => roundRank(a["Round"]) - roundRank(b["Round"]));
          html += '<div class="divbody"><div class="sec">Podium</div><ul>' +
            medals.map(r => '<li><span class="who">' + pic(r["Athlete"], r["NOC"], true) + esc(r["Athlete"]) + '</span><span class="noc">' + esc(r["NOC"]) + "</span>" + chip(r["Placement"]) + "</li>").join("") + "</ul>";
          html += '<div class="sec">Matches</div>';
          if (!mts.length) html += '<p class="empty">No match data loaded for this division yet.</p>';
          else html += '<table class="matches">' + mts.map(m =>
            '<tr><td class="rnd">' + esc(S(m["Round"]).toUpperCase()) + "</td>" +
            '<td><div class="pline">' + esc(m["Winner"]) + ' <span class="noc">' + esc(m["Winner NOC"]) + "</span></div>" +
            '<div class="pline"><span class="defw">def.</span> ' + esc(m["Loser"]) + ' <span class="noc">' + esc(m["Loser NOC"]) + "</span></div></td>" +
            '<td class="score">' + esc(S(m["Method"]).toUpperCase()) + " " + esc(m["Score"]) + "</td></tr>").join("") + "</table>";
          html += '<details class="entries"><summary>Full entry list (' + rows.length + ")</summary><ul>" +
            rows.map(r => '<li><span class="who">' + pic(r["Athlete"], r["NOC"], true) + esc(r["Athlete"]) + '</span><span class="noc">' + esc(r["NOC"]) + "</span>" + chip(r["Placement"]) + "</li>").join("") +
            "</ul></details></div>";
        }
        html += "</div>";
      });
      html += "</div>";
    }
    html += "</div>";
  }
  return html;
}

/* ---------------- render + events ---------------- */
function render() {
  document.getElementById("tab-search").className = tab === "search" ? "on" : "";
  document.getElementById("tab-events").className = tab === "events" ? "on" : "";
  const app = document.getElementById("app");
  app.innerHTML = tab === "search" ? renderSearch() : renderEvents();
  const q = document.getElementById("q");
  if (q) {
    q.addEventListener("input", e => { query = e.target.value; render(); });
    q.focus();
    q.setSelectionRange(q.value.length, q.value.length);
  }
  app.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.getAttribute("data-toggle");
    openKeys.has(k) ? openKeys.delete(k) : openKeys.add(k);
    render();
  }));
  app.querySelectorAll("[data-ytoggle]").forEach(btn => btn.addEventListener("click", () => {
    const y = btn.getAttribute("data-ytoggle");
    closedYears.has(y) ? closedYears.delete(y) : closedYears.add(y);
    render();
  }));
}
document.getElementById("tab-search").addEventListener("click", () => { tab = "search"; render(); });
document.getElementById("tab-events").addEventListener("click", () => { tab = "events"; render(); });
boot();
</script>
</body>
</html>
