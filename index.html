<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Archive | USATKD National Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --black:#000000; --gold:#C3A141; --hi:#ECBE43; --white:#FFFFFF; --paper:#F5F3EE; --line:#DDD6C8; --faint:#F0EBDF; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Montserrat','Helvetica Neue',Arial,sans-serif; background:var(--paper); color:var(--black); }
  .bebas { font-family:'Bebas Neue','Arial Narrow',sans-serif; letter-spacing:0.04em; }
  header { background:var(--black); color:var(--white); }
  .wrap { max-width:920px; margin:0 auto; padding:0 16px; }
  .head-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:20px 0 14px; }
  .head-row img { width:84px; height:84px; }
  .eyebrow { color:var(--gold); font-size:10px; font-weight:700; letter-spacing:0.28em; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:44px; line-height:1; letter-spacing:0.04em; margin-top:2px; }
  h1 span { color:var(--hi); }
  .sub { font-size:11px; color:#BBB; margin-top:2px; }
  .stats { display:flex; gap:20px; margin-left:auto; text-align:right; }
  .stat b { display:block; font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; color:var(--hi); font-weight:400; }
  .stat small { font-size:9px; letter-spacing:0.2em; color:#999; text-transform:uppercase; }
  .rule { height:3px; background:linear-gradient(90deg,var(--gold),var(--hi)); }
  nav { display:flex; gap:4px; }
  nav button { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.04em; padding:8px 16px; border:none; cursor:pointer; background:transparent; color:#CCC; }
  nav button.on { background:var(--hi); color:var(--black); }
  main { padding:24px 0 48px; }
  input[type=search] { width:100%; font:inherit; font-size:15px; padding:12px 16px; background:var(--white); border:2px solid var(--black); border-radius:6px; }
  .hint { font-size:13px; color:#555; margin-top:20px; }
  .card { background:var(--white); border:1px solid var(--line); border-radius:6px; margin-top:16px; overflow:hidden; }
  .card-head { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:2px solid var(--hi); }
  .aname { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.04em; }
  .noc { font-size:10px; font-weight:700; background:var(--black); color:var(--hi); border-radius:3px; padding:2px 6px; vertical-align:middle; }
  .count { font-size:11px; color:#888; }
  .rowbtn { width:100%; text-align:left; background:none; border:none; font:inherit; cursor:pointer; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .rowbtn:hover { background:#FBF9F4; }
  .ev-name { font-size:13px; font-weight:600; }
  .ev-meta { font-size:11px; color:#777; }
  .chip { font-size:10px; font-weight:700; letter-spacing:0.12em; padding:3px 8px; border-radius:3px; white-space:nowrap; min-width:82px; text-align:center; flex:none; align-self:center; box-sizing:border-box; }
  .chip.g { background:var(--hi); color:var(--black); border:1px solid var(--hi); }
  .chip.s { background:var(--white); color:var(--black); border:1px solid var(--black); }
  .chip.b { color:var(--gold); border:1px solid var(--gold); }
  .chip.c { color:#999; border:1px solid transparent; }
  .divline { border-top:1px solid var(--faint); }
  .matchlog { background:#FBF9F4; border-top:1px solid var(--faint); padding:8px 16px 12px; }
  .matchlog h4 { font-size:10px; letter-spacing:0.18em; color:#8A7430; text-transform:uppercase; margin:6px 0; }
  table.matches { width:100%; border-collapse:collapse; font-size:12px; }
  table.matches td { padding:5px 8px 5px 0; border-bottom:1px solid var(--faint); vertical-align:top; }
  table.matches tr:last-child td { border-bottom:none; }
  td.rnd { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:0.06em; width:44px; color:#444; }
  td.res { width:34px; font-weight:700; }
  td.res.w { color:#8A7430; } td.res.l { color:#999; }
  td.score { width:90px; color:#555; white-space:nowrap; }
  .empty { font-size:12px; color:#999; padding:6px 0; }
  .divhead { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.04em; }
  .grid { display:grid; gap:8px; grid-template-columns:1fr; padding:12px 16px; }
  @media(min-width:640px){ .grid { grid-template-columns:1fr 1fr; } }
  .divcard { border:1px solid #E5DFD2; border-radius:4px; }
  .divbody { border-top:1px solid var(--faint); padding:8px 12px; font-size:13px; max-height:340px; overflow-y:auto; }
  .divbody li { list-style:none; display:grid; grid-template-columns:minmax(0,1fr) 44px auto; align-items:center; column-gap:8px; padding:3px 0; }
  .divbody li .who { display:flex; align-items:center; gap:6px; min-width:0; }
  .divbody li .noc { justify-self:center; }
  .pline { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
  .pline .noc { flex:none; }
  .defw { color:#999; font-size:11px; flex:none; }
  td.score { text-align:right; }
  .divbody .sec { font-size:10px; letter-spacing:0.18em; color:#8A7430; text-transform:uppercase; margin:8px 0 4px; }
  details.entries summary { font-size:11px; color:#7A6420; cursor:pointer; margin-top:8px; }
  .toolbar { display:flex; justify-content:flex-end; margin-top:4px; }
  .toolbar a, .toolbar button { font-size:12px; font-weight:600; color:#7A6420; text-decoration:underline; background:none; border:none; cursor:pointer; font-family:inherit; }
  .error { background:var(--white); border:2px solid var(--black); border-left:6px solid var(--gold); border-radius:6px; padding:16px; font-size:13px; margin-top:16px; }
  .pic { width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); flex:none; object-fit:cover; }
  .pic.sm { width:22px; height:22px; border-width:1px; vertical-align:middle; margin-right:6px; }
  .namewrap { display:flex; align-items:center; gap:10px; }
  .error code { background:var(--faint); padding:1px 4px; border-radius:3px; }
  .loading { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--gold); letter-spacing:0.08em; padding:24px 0; }
  footer { background:var(--black); color:#AAA; margin-top:40px; }
  footer .wrap { padding:14px 16px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; }
  .filters { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .filters button { font:inherit; font-size:11px; font-weight:600; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--white); cursor:pointer; }
  .filters button.on { background:var(--black); color:var(--hi); border-color:var(--black); }
  .yearbar { width:100%; display:flex; align-items:center; gap:12px; margin-top:20px; padding:8px 16px; background:var(--black); color:var(--white); border:none; border-left:6px solid var(--hi); border-radius:4px; cursor:pointer; font-family:inherit; }
  .yearbar:first-of-type { margin-top:12px; }
  .yeartxt { font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; letter-spacing:0.06em; color:var(--hi); }
  .yearbar .count { color:#AAA; }
  .yearbar .tog { margin-left:auto; font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--hi); }
  /* Academy Athletes tab */
  .acard .card-head { padding:14px 16px; }
  .pic.lg { width:64px; height:64px; border-width:3px; }
  .pic.ph { display:flex; align-items:center; justify-content:center; background:var(--faint); color:var(--gold); font-family:'Bebas Neue',sans-serif; font-size:22px; }
  .amember { font-size:10px; color:#888; letter-spacing:0.12em; text-transform:uppercase; margin-top:2px; }
  .cycle { display:flex; align-items:center; gap:10px; padding:6px 16px; background:var(--black); color:var(--hi); font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:0.1em; }
  .cycle .tally { margin-left:auto; display:flex; gap:6px; }
  .cycle .tally span { font-family:'Montserrat',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.08em; padding:2px 7px; border-radius:3px; }
  .cycle .tally .tg { background:var(--hi); color:var(--black); }
  .cycle .tally .ts { background:var(--white); color:var(--black); }
  .cycle .tally .tb { border:1px solid var(--gold); color:var(--gold); }
  .cycle .tally .tn { color:#999; border:1px solid #444; }
  .cycle .tally { flex-wrap:wrap; justify-content:flex-end; }
  .gcell { display:inline-flex; align-items:center; gap:4px; padding-left:8px; margin-left:4px; border-left:1px solid #444; }
  .gcell:first-child { border-left:none; padding-left:0; margin-left:0; }
  .gcell b { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:15px; letter-spacing:0.08em; color:var(--white); margin-right:2px; }
  .prior summary .gsum { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .prior summary .gcell { border-left-color:var(--line); }
  .prior summary .gcell b { color:#8A7430; }
  .prior summary .gcell span { font-size:9px; font-weight:700; letter-spacing:0.08em; padding:1px 6px; border-radius:3px; }
  .prior summary .tg { background:var(--hi); color:var(--black); }
  .prior summary .ts { background:var(--white); color:var(--black); border:1px solid var(--black); }
  .prior summary .tb { border:1px solid var(--gold); color:var(--gold); }
  .prior { border-top:1px dashed var(--line); background:#FAF8F3; }
  .prior summary { list-style:none; cursor:pointer; padding:8px 16px; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#8A7430; display:flex; justify-content:space-between; }
  .prior summary::-webkit-details-marker { display:none; }
  .prior .rowbtn { opacity:0.72; }
  .prior .rowbtn:hover { opacity:1; }
  .acard .empty { padding:12px 16px; }
  .prior.sub summary { padding-left:28px; background:#F3EFE6; }
  .prior.sub .rowbtn { padding-left:28px; }
  .export { font:inherit; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:5px 10px; border:1px solid var(--gold); border-radius:3px; background:none; color:#7A6420; cursor:pointer; white-space:nowrap; }
  .export:hover { background:var(--hi); color:var(--black); border-color:var(--hi); }
  .headright { display:flex; align-items:center; gap:10px; }
  /* print sheet */
  #printsheet { display:none; }
  @media print {
    @page { size:letter; margin:0.5in; }
    body > *:not(#printsheet) { display:none !important; }
    body { background:#fff; }
    #printsheet { display:block; color:#000; font-family:'Montserrat','Helvetica Neue',Arial,sans-serif; font-size:9.5pt; }
    .ps-head { display:flex; align-items:center; gap:14px; border-bottom:3px solid #C3A141; padding-bottom:10px; }
    .ps-head img.crest { width:60px; height:60px; }
    .ps-head .eyebrow { color:#8A7430; font-size:8pt; font-weight:700; letter-spacing:0.28em; }
    .ps-head h1 { font-family:'Bebas Neue',sans-serif; font-size:26pt; line-height:1; letter-spacing:0.04em; margin:2px 0 0; }
    .ps-head .meta { font-size:8.5pt; color:#555; margin-top:2px; }
    .ps-head img.pic { width:64px; height:64px; margin-left:auto; border:3px solid #C3A141; border-radius:50%; object-fit:cover; }
    .ps-band { display:flex; align-items:center; gap:10px; margin-top:12px; padding:5px 10px; background:#000; color:#ECBE43; font-family:'Bebas Neue',sans-serif; font-size:12pt; letter-spacing:0.1em; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .ps-band .sub { margin-left:auto; font-family:'Montserrat',sans-serif; font-size:7.5pt; font-weight:600; letter-spacing:0.12em; color:#C3A141; text-transform:uppercase; }
    .ps-page { page-break-before:always; break-before:page; }
    table.ps tr.mark td { background:#F3EFE6; color:#8A7430; font-family:'Bebas Neue',sans-serif; font-size:10pt; letter-spacing:0.14em; padding:4px 6px; border-top:2px solid #C3A141; border-bottom:2px solid #C3A141; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    table.ps.gt { width:60%; margin-top:6px; }
    table.ps.gt th { text-align:right; font-size:7.5pt; letter-spacing:0.14em; text-transform:uppercase; color:#8A7430; padding:3px 8px; border-bottom:2px solid #C3A141; }
    table.ps.gt th:first-child { text-align:left; }
    table.ps.gt td { text-align:right; padding:4px 8px; font-size:10pt; }
    table.ps.gt td.gr { text-align:left; font-family:'Bebas Neue',sans-serif; font-size:12pt; letter-spacing:0.08em; }
    table.ps.gt td.mg { color:#8A7430; font-weight:700; } table.ps.gt td.ms { font-weight:700; } table.ps.gt td.mb { color:#A0813A; font-weight:700; }
    table.ps.gt td.tot { font-weight:700; }
    table.ps.gt tr.sum td { border-top:2px solid #000; border-bottom:none; font-weight:700; }
    .ps-band .gcell b { color:#fff; font-size:11pt; }
    .ps-band .tally span:not(.gcell) { font-family:'Montserrat',sans-serif; font-size:7.5pt; font-weight:700; letter-spacing:0.08em; padding:1px 6px; border-radius:3px; }
    .ps-band .tg { background:#ECBE43; color:#000; } .ps-band .ts { background:#fff; color:#000; } .ps-band .tb { border:1px solid #C3A141; color:#C3A141; }
    table.ps { width:100%; border-collapse:collapse; margin-top:4px; }
    table.ps td { padding:3px 6px; border-bottom:1px solid #E5DFD2; vertical-align:top; }
    table.ps td.d { width:78px; color:#555; white-space:nowrap; }
    table.ps td.dv { width:120px; white-space:nowrap; }
    table.ps td.lv { width:110px; color:#555; }
    table.ps td.pl { width:66px; text-align:right; font-weight:700; letter-spacing:0.1em; font-size:8pt; }
    table.ps td.pl.g { color:#8A7430; } table.ps td.pl.c { color:#999; font-weight:500; }
    .ps-more { font-size:8pt; color:#777; padding:4px 6px; }
    .ps-foot { margin-top:14px; border-top:1px solid #C3A141; padding-top:6px; font-size:7.5pt; color:#777; letter-spacing:0.1em; text-transform:uppercase; display:flex; justify-content:space-between; }
  }
</style>
</head>

const SHEET_ID = "16--LTisSbdw9xpA-dTtN40EiEaf5_bdmjQHI2Czf6Lg";

/* Folder in this repo that holds Academy athlete headshots.
   Filenames are listed in the sheet's Roster tab. */
const PHOTO_BASE = "photos/";

/* Rankings reset. Results dated on or after this day are shown as the
   current cycle on the Academy Athletes tab; earlier results are folded away. */
const RANKINGS_RESET = "2026-06-01";
const RESET_LABEL = "June 2026";
const SEASON_YEAR = RANKINGS_RESET.slice(0, 4);

/* WT G-grade for an event. Explicit "G1", "G2", "G4" in the Level column wins;
   named tiers map to their grade. Domestic events (National, Team Trials) and
   ungraded internationals return null and are left out of the G breakdown. */
const G_BY_LEVEL = [
  [/olympic games/i, 20], [/world championships/i, 14], [/grand prix final/i, 12],
  [/grand prix challenge/i, 4], [/grand prix/i, 8], [/presidents cup/i, 2],
];
function gLevel(ev) {
  const lv = S(ev && ev["Level"]);
  const m = lv.match(/\bG[- ]?(\d+)\b/i);
  if (m) return Number(m[1]);
  for (const [re, g] of G_BY_LEVEL) if (re.test(lv)) return g;
  return null;
}
function gBreakdown(rows) {
  const byG = new Map();
  rows.forEach(r => {
    const p = Number(r["Placement"]);
    if (!(p >= 1 && p <= 3)) return;
    const g = gLevel(DB.evById[S(r["EventID"])]);
    if (g === null) return;
    if (!byG.has(g)) byG.set(g, [0, 0, 0]);
    byG.get(g)[p - 1]++;
  });
  return [...byG.entries()].sort((a, b) => b[0] - a[0]).map(([g, c]) =>
    '<span class="gcell"><b>G' + g + "</b>" +
    (c[0] ? '<span class="tg">' + c[0] + " GOLD</span>" : "") +
    (c[1] ? '<span class="ts">' + c[1] + " SILVER</span>" : "") +
    (c[2] ? '<span class="tb">' + c[2] + " BRONZE</span>" : "") + "</span>").join("");
}

/* ---------------- data loading (gviz JSON) ---------------- */
async function loadTab(name) {
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(name) + "&t=" + Date.now();
  const res = await fetch(url);
  if (!res.ok) throw new Error("Could not reach the sheet (HTTP " + res.status + ")");
  const text = await res.text();
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start === -1) throw new Error("Unexpected response for tab " + name);
  const j = JSON.parse(text.slice(start, end + 1));
  if (j.status === "error") throw new Error("Sheet error on tab " + name + ": " + (j.errors && j.errors[0] && j.errors[0].detail_message || ""));
  const labels = j.table.cols.map(c => (c.label || "").trim());
  return j.table.rows.map(r => {
    const o = {};
    r.c.forEach((cell, i) => {
      let v = cell ? cell.v : "";
      if (typeof v === "string" && /^Date\(/.test(v)) {
        const m = v.match(/Date\((\d+),(\d+),(\d+)/);
        v = m ? m[1] + "-" + String(+m[2] + 1).padStart(2, "0") + "-" + String(+m[3]).padStart(2, "0") : (cell.f || v);
      }
      if (v === null || v === undefined) v = "";
      o[labels[i]] = v;
    });
    return o;
  }).filter(o => Object.values(o).some(v => String(v).trim() !== ""));
}

const S = v => String(v == null ? "" : v).trim();
const KEY = (n, c) => S(n).toUpperCase() + "|" + S(c).toUpperCase();
const ROUND_ORDER = { R256:0, R128:1, R64:2, R32:3, R16:4, QF:5, SF:6, F:7 };
const roundRank = r => ROUND_ORDER[S(r).toUpperCase()] ?? 99;

function fmtDate(d) {
  d = S(d);
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  const opts = { month: "long", day: "numeric" };
  if (dt.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return dt.toLocaleDateString("en-US", opts);
}
function flip(score) {
  const parts = S(score).split(":");
  return parts.length === 2 ? parts[1].trim() + ":" + parts[0].trim() : S(score);
}
function esc(s) { return S(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch])); }
function chip(p) {
  p = Number(p);
  if (p === 1) return '<span class="chip g">GOLD</span>';
  if (p === 2) return '<span class="chip s">SILVER</span>';
  if (p === 3) return '<span class="chip b">BRONZE</span>';
  return '<span class="chip c">COMPETED</span>';
}

function tokens(s) { return S(s).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean); }
function photoFor(name, noc) {
  if (!DB || !DB.roster) return null;
  const nt = tokens(name), nu = S(noc).toUpperCase();
  for (const r of DB.roster) {
    if (S(r["NOC"]).toUpperCase() !== nu || !S(r["Photo"])) continue;
    const rt = tokens(r["Display Name"]);
    if (rt.length >= 2 && rt.every(t => nt.includes(t))) return PHOTO_BASE + S(r["Photo"]);
  }
  return null;
}
function pic(name, noc, small) {
  const p = photoFor(name, noc);
  return p ? '<img class="pic' + (small ? " sm" : "") + '" src="' + esc(p) + '" alt="" loading="lazy" onerror="this.remove()">' : "";
}

/* ---------------- de-duplication ----------------
   Two coaches pasting the same event must not double entries.
   Events are merged when EventID matches OR name plus date match;
   Results and Matches rows are then collapsed on their natural keys. */
function dedupe(events, results, matches) {
  const canon = {};            // any EventID -> canonical EventID
  const seenEv = new Map();    // "name|date" -> canonical EventID
  const keptEvents = [];
  events.forEach(e => {
    const id = S(e["EventID"]);
    const nk = S(e["Event Name"]).toUpperCase().replace(/\s+/g, " ") + "|" + S(e["Start Date"]);
    if (canon[id]) return;                       // exact duplicate EventID row
    if (seenEv.has(nk)) { canon[id] = seenEv.get(nk); return; }  // same event, different ID
    canon[id] = id; seenEv.set(nk, id); keptEvents.push(e);
  });
  const cid = id => canon[S(id)] || S(id);
  const seenR = new Map();
  results.forEach(r => {
    const k = cid(r["EventID"]) + "|" + S(r["Division"]).toUpperCase() + "|" + KEY(r["Athlete"], r["NOC"]);
    const prev = seenR.get(k);
    if (!prev || (!S(prev["Placement"]) && S(r["Placement"]))) seenR.set(k, r);  // prefer the row that carries a placement
  });
  const seenM = new Map();
  matches.forEach(m => {
    const k = cid(m["EventID"]) + "|" + S(m["Division"]).toUpperCase() + "|" + S(m["Round"]).toUpperCase() +
              "|" + KEY(m["Winner"], m["Winner NOC"]) + "|" + KEY(m["Loser"], m["Loser NOC"]);
    if (!seenM.has(k)) seenM.set(k, m);
  });
  const fix = rows => rows.map(r => Object.assign({}, r, { EventID: cid(r["EventID"]) }));
  return { events: keptEvents, results: fix([...seenR.values()]), matches: fix([...seenM.values()]) };
}

}

/* ---------------- athlete search ---------------- */
function athleteMatches(name, noc, eventId, division) {
  const mine = DB.matches.filter(m =>
    S(m["EventID"]) === eventId && S(m["Division"]) === division &&
    (KEY(m["Winner"], m["Winner NOC"]) === KEY(name, noc) || KEY(m["Loser"], m["Loser NOC"]) === KEY(name, noc))
  );
  mine.sort((a, b) => roundRank(a["Round"]) - roundRank(b["Round"]));
  return mine.map(m => {
    const won = KEY(m["Winner"], m["Winner NOC"]) === KEY(name, noc);
    return {
      round: S(m["Round"]).toUpperCase(),
      won,
      opp: won ? S(m["Loser"]) : S(m["Winner"]),
      oppNoc: won ? S(m["Loser NOC"]) : S(m["Winner NOC"]),
      method: S(m["Method"]).toUpperCase(),
      score: won ? S(m["Score"]) : flip(m["Score"]),
    };
  });
}

/* ---------------- Academy athletes ---------------- */
function rosterResults(r) {
  const rt = tokens(r["Display Name"]), nu = S(r["NOC"]).toUpperCase();
  if (rt.length < 2) return [];
  const rows = DB.results.filter(x => S(x["NOC"]).toUpperCase() === nu && rt.every(t => tokens(x["Athlete"]).includes(t)));
  const dt = x => S(DB.evById[S(x["EventID"])] && DB.evById[S(x["EventID"])]["Start Date"]);
  rows.sort((x, y) => dt(y).localeCompare(dt(x)));
  return rows;
}
function resultRow(r, keyPrefix) {
  const evId = S(r["EventID"]), div = S(r["Division"]);
  const ev = DB.evById[evId] || {};
  const k = keyPrefix + KEY(r["Athlete"], r["NOC"]) + "@" + evId + "@" + div;
  const open = openKeys.has(k);
  let html = '<div class="divline"><button class="rowbtn" data-toggle="' + esc(k) + '">' +
    '<span><span class="ev-name">' + esc(ev["Event Name"] || evId) + '</span><br>' +
    '<span class="ev-meta">' + esc(fmtDate(ev["Start Date"])) + " · " + esc(div) + (ev["Level"] ? " · " + esc(ev["Level"]) : "") + "</span></span>" +
    chip(r["Placement"]) + "</button>";
  if (open) {
    const log = athleteMatches(S(r["Athlete"]), S(r["NOC"]), evId, div);
    html += '<div class="matchlog"><h4>Match log</h4>';
    if (!log.length) html += '<p class="empty">No match data loaded for this division yet.</p>';
    else html += '<table class="matches">' + log.map(m =>
      '<tr><td class="rnd">' + esc(m.round) + "</td>" +
      '<td class="res ' + (m.won ? 'w">W' : 'l">L') + "</td>" +
      '<td><div class="pline"><span class="defw">' + (m.won ? "def." : "lost to") + "</span> " + esc(m.opp) + ' <span class="noc">' + esc(m.oppNoc) + "</span></div></td>" +
      '<td class="score">' + esc(m.method) + " " + esc(m.score) + "</td></tr>").join("") + "</table>";
    html += "</div>";
  }
  return html + "</div>";
}
function renderAcademy() {
  if (!DB.roster || !DB.roster.length) return '<p class="hint">No Academy athletes listed yet. Add rows to the Roster tab of the sheet (Display Name, Member No, Gender, NOC, Photo).</p>';

      const rows = rosterResults(r);
      const dt = x => S(DB.evById[S(x["EventID"])] && DB.evById[S(x["EventID"])]["Start Date"]);
      const cur = rows.filter(x => dt(x) >= RANKINGS_RESET);
      const y26 = rows.filter(x => dt(x) < RANKINGS_RESET && dt(x).slice(0, 4) === SEASON_YEAR);
      const old = rows.filter(x => dt(x).slice(0, 4) < SEASON_YEAR);
      const photo = S(r["Photo"]) ? '<img class="pic lg" src="' + esc(PHOTO_BASE + S(r["Photo"])) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;pic lg ph&quot;>' + esc(name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase()) + '</div>\'">'
                                   : '<div class="pic lg ph">' + esc(name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase()) + "</div>";
      const rk = KEY(name, noc);
      html += '<div class="card acard"><div class="card-head"><div class="namewrap">' + photo +
        '<div><span class="aname">' + esc(name) + '</span> <span class="noc">' + esc(noc) + '</span>' +
        (S(r["Member No"]) ? '<div class="amember">Member ' + esc(r["Member No"]) + "</div>" : "") + "</div></div>" +
        '<span class="headright"><span class="count">' + rows.length + " result" + (rows.length !== 1 ? "s" : "") + '</span>' +
        '<button class="export" data-export="' + esc(rk) + '">Export PDF</button></span></div>';
      html += '<div class="cycle">Since the ' + esc(RESET_LABEL) + ' reset<span class="tally">' + gBreakdown(cur) + "</span></div>";
      if (!cur.length) html += '<p class="empty">No results since the reset yet.</p>';
      cur.forEach(x => { html += resultRow(x, "ac@"); });

        html += '<details class="prior"' + (openKeys.has(fk) ? " open" : "") + '><summary data-ptoggle="' + esc(fk) + '"><span>Full ' + SEASON_YEAR + ' results · ' + (cur.length + y26.length) + " result" + (cur.length + y26.length !== 1 ? "s" : "") + '</span><span class="gsum">' + gBreakdown(cur.concat(y26)) + "</span></summary>";
        if (!y26.length) html += '<p class="empty">No other ' + SEASON_YEAR + ' results before the reset.</p>';
        y26.forEach(x => { html += resultRow(x, "ay@"); });
        if (old.length) {
          const ok = "old@" + rk;
          html += '<details class="prior sub"' + (openKeys.has(ok) ? " open" : "") + '><summary data-ptoggle="' + esc(ok) + '"><span>Before ' + SEASON_YEAR + ' · ' + old.length + " result" + (old.length !== 1 ? "s" : "") + '</span><span class="gsum">' + gBreakdown(old) + "</span></summary>";
          old.forEach(x => { html += resultRow(x, "ap@"); });
          html += "</details>";
        }
        html += "</details>";
      }
      html += "</div>";
    });
  });
  return html;
}

/* ---------------- two-page PDF export ---------------- */
const QUAD_START = "2025-01-01";     // Olympic quad: Jan 1 2025 through LA 2028
function gStats(rows) {
  const m = new Map();
  rows.forEach(x => {
    const g = gLevel(DB.evById[S(x["EventID"])]);
    if (g === null) return;
    if (!m.has(g)) m.set(g, { ev: 0, m: [0, 0, 0] });
    const o = m.get(g); o.ev++;
    const p = Number(x["Placement"]); if (p >= 1 && p <= 3) o.m[p - 1]++;
  });
  return [...m.entries()].sort((a, b) => b[0] - a[0]);
}
function exportAthlete(rk) {
  const r = DB.roster.find(x => KEY(x["Display Name"], x["NOC"]) === rk);
  if (!r) return;
  const name = S(r["Display Name"]), noc = S(r["NOC"]);
  const rows = rosterResults(r);                       // newest first
  const dt = x => S(DB.evById[S(x["EventID"])] && DB.evById[S(x["EventID"])]["Start Date"]);
  const seasonStart = SEASON_YEAR + "-01-01";
  const season = rows.filter(x => dt(x) >= seasonStart);
  const quadRest = rows.filter(x => dt(x) >= QUAD_START && dt(x) < seasonStart);
  const quadAll = rows.filter(x => dt(x) >= QUAD_START);
  const MAX = 26;                                      // page-1 row budget (letter, 0.5in margins)
  let budget = MAX;
  const tr = x => {
    const ev = DB.evById[S(x["EventID"])] || {}; const p = Number(x["Placement"]);
    const lab = p === 1 ? "GOLD" : p === 2 ? "SILVER" : p === 3 ? "BRONZE" : "Competed";
    return '<tr><td class="d">' + esc(fmtDate(ev["Start Date"])) + '</td><td>' + esc(ev["Event Name"] || "") + '</td><td class="dv">' + esc(x["Division"]) + '</td><td class="lv">' + esc(ev["Level"] || "") + '</td><td class="pl ' + (p >= 1 && p <= 3 ? "g" : "c") + '">' + lab + "</td></tr>";
  };
  const marker = '<tr class="mark"><td colspan="5">Rankings reset · ' + esc(RESET_LABEL) + "</td></tr>";
  let h = '<div class="ps-head">' + crestImg() +
    '<div><div class="eyebrow">USATKD NATIONAL ACADEMY · ' + SEASON_YEAR + ' ATHLETE REVIEW</div><h1>' + esc(name) + '</h1>' +
    '<div class="meta">' + esc(noc) + (S(r["Member No"]) ? " · Member " + esc(r["Member No"]) : "") + "</div></div>" +
    (S(r["Photo"]) ? '<img class="pic" src="' + esc(PHOTO_BASE + S(r["Photo"])) + '" alt="" onerror="this.remove()">' : "") + "</div>";
  h += '<div class="ps-band">Competition Results<span class="sub">' + SEASON_YEAR + " season · newest first</span></div>";
  let body = "", placed = false;
  if (!season.length) body += marker;
  season.forEach(x => {
    if (!placed && dt(x) < RANKINGS_RESET) { body += marker; placed = true; }
    if (budget-- > 0) body += tr(x);
  });
  if (season.length && !placed) body += marker;         // every season row is post-reset
  h += '<table class="ps">' + body + "</table>";
  if (!season.length) h += '<div class="ps-more">No ' + SEASON_YEAR + " results in the archive.</div>";
  h += '<div class="ps-band">Remaining Olympic Quad Results<span class="sub">January 1, 2025 through December 31, ' + (Number(SEASON_YEAR) - 1) + "</span></div>";
  if (!quadRest.length) h += '<div class="ps-more">No results in this period.</div>';
  else {
    const shown = quadRest.slice(0, Math.max(0, budget)); budget -= shown.length;
    h += '<table class="ps">' + shown.map(tr).join("") + "</table>";
    if (quadRest.length > shown.length) h += '<div class="ps-more">+ ' + (quadRest.length - shown.length) + " earlier results not shown (see the archive)</div>";
  }
  h += '<div class="ps-foot"><span>Academy Results Archive · page 1 of 2</span><span>Generated ' + esc(today()) + "</span></div>";
  /* ---- page 2: breakdown by grade ---- */
  const gtable = (title, sub, list) => {
    const st = gStats(list);
    let t = '<div class="ps-band">' + title + '<span class="sub">' + sub + "</span></div>";
    if (!st.length) return t + '<div class="ps-more">No G-graded events in this period.</div>';
    const tot = { ev: 0, m: [0, 0, 0] };
    t += '<table class="ps gt"><tr class="hd"><th>Grade</th><th>Events</th><th>Gold</th><th>Silver</th><th>Bronze</th><th>Medals</th></tr>';
    st.forEach(([g, o]) => {
      tot.ev += o.ev; o.m.forEach((v, i) => tot.m[i] += v);
      const tm = o.m[0] + o.m[1] + o.m[2];
      t += '<tr><td class="gr">G' + g + '</td><td>' + o.ev + '</td><td class="mg">' + (o.m[0] || "") + '</td><td class="ms">' + (o.m[1] || "") + '</td><td class="mb">' + (o.m[2] || "") + '</td><td class="tot">' + (tm || "") + "</td></tr>";
    });
    const ttm = tot.m[0] + tot.m[1] + tot.m[2];
    t += '<tr class="sum"><td class="gr">Total</td><td>' + tot.ev + '</td><td class="mg">' + (tot.m[0] || "") + '</td><td class="ms">' + (tot.m[1] || "") + '</td><td class="mb">' + (tot.m[2] || "") + '</td><td class="tot">' + (ttm || "") + "</td></tr></table>";
    return t;
  };
  h += '<div class="ps-page"><div class="ps-head"><div><div class="eyebrow">USATKD NATIONAL ACADEMY · ' + SEASON_YEAR + ' ATHLETE REVIEW</div><h1>' + esc(name) + '</h1><div class="meta">Results by event grade · WT G-graded events only, domestic events excluded</div></div></div>';
  h += gtable(SEASON_YEAR + " Season", "January 1 through December 31, " + SEASON_YEAR, season);
  h += gtable("2025–2028 Olympic Quad", "January 1, 2025 to date", quadAll);
  h += '<div class="ps-foot"><span>Academy Results Archive · page 2 of 2</span><span>Generated ' + esc(today()) + "</span></div></div>";
  let ps = document.getElementById("printsheet");
  if (!ps) { ps = document.createElement("div"); ps.id = "printsheet"; document.body.appendChild(ps); }
  ps.innerHTML = h;
  const prevTitle = document.title;
  document.title = name.replace(/\s+/g, "_") + "_" + SEASON_YEAR + "_Review";   // default PDF filename
  const done = () => { document.title = prevTitle; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  const imgs = [...ps.querySelectorAll("img")].filter(i => !i.complete);
  if (!imgs.length) window.print();
  else { let n = imgs.length; imgs.forEach(i => { i.onload = i.onerror = () => { if (--n === 0) window.print(); }; }); }
}
function crestImg() { const c = document.querySelector("header img"); return c ? '<img class="crest" src="' + c.src + '" alt="">' : ""; }
function today() { return new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); }

/* ---------------- events browser ---------------- */
function renderEvents() {
  let html = '<div class="toolbar"><a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '" target="_blank" rel="noopener">Open the source sheet</a></div>';
  const evs = [...DB.events].sort((a, b) => S(b["Start Date"]).localeCompare(S(a["Start Date"])));
  const byYear = new Map();
  evs.forEach(ev => {
    const y = S(ev["Start Date"]).slice(0, 4) || "Undated";
    if (!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(ev);
  });
  const years = [...byYear.keys()];
  if (!yearsInitialized) {          // first visit: newest year open, older years collapsed
    years.slice(1).forEach(y => closedYears.add(y));
    yearsInitialized = true;
  }
  years.forEach(year => {
    const group = byYear.get(year);
    const closed = closedYears.has(year);
    html += '<button class="yearbar" data-ytoggle="' + esc(year) + '"><span class="yeartxt">' + esc(year) + '</span>' +
            '<span class="count">' + group.length + " event" + (group.length !== 1 ? "s" : "") + '</span>' +
            '<span class="tog">' + (closed ? "+" : "–") + "</span></button>";
    if (closed) return;
    group.forEach(ev => renderEventCard(ev));
  });
  function renderEventCard(ev) {
    const evId = S(ev["EventID"]);
    const divs = [...new Set(DB.results.filter(r => S(r["EventID"]) === evId).map(r => S(r["Division"])))];
    const k = "ev@" + evId;
    const open = openKeys.has(k);
    html += '<div class="card"><button class="rowbtn" data-toggle="' + esc(k) + '">' +
            '<span><span class="ev-name">' + esc(ev["Event Name"]) + '</span><br><span class="ev-meta">' +
            esc(fmtDate(ev["Start Date"])) + (ev["Location"] ? " · " + esc(ev["Location"]) : "") + (ev["Level"] ? " · " + esc(ev["Level"]) : "") +
            " · " + divs.length + ' divisions</span></span><span class="divhead" style="color:var(--gold)">' + (open ? "–" : "+") + "</span></button>";
    if (open) {
      html += '<div class="grid" style="border-top:2px solid var(--hi)">';
      divs.forEach(div => {
        const rows = DB.results.filter(r => S(r["EventID"]) === evId && S(r["Division"]) === div);
        const medals = rows.filter(r => Number(r["Placement"]) >= 1).sort((a, b) => Number(a["Placement"]) - Number(b["Placement"]));
        const dk = "dv@" + evId + "@" + div;
        const dopen = openKeys.has(dk);
        html += '<div class="divcard"><button class="rowbtn" data-toggle="' + esc(dk) + '">' +
                '<span class="divhead">' + esc(div.toUpperCase()) + '</span><span class="count">' + rows.length + " competitors</span></button>";
        if (dopen) {
          const mts = DB.matches.filter(m => S(m["EventID"]) === evId && S(m["Division"]) === div)
            .sort((a, b) => roundRank(a["Round"]) - roundRank(b["Round"]));
          html += '<div class="divbody"><div class="sec">Podium</div><ul>' +
            medals.map(r => '<li><span class="who">' + pic(r["Athlete"], r["NOC"], true) + esc(r["Athlete"]) + '</span><span class="noc">' + esc(r["NOC"]) + "</span>" + chip(r["Placement"]) + "</li>").join("") + "</ul>";
          html += '<div class="sec">Matches</div>';
          if (!mts.length) html += '<p class="empty">No match data loaded for this division yet.</p>';
          else html += '<table class="matches">' + mts.map(m =>
            '<tr><td class="rnd">' + esc(S(m["Round"]).toUpperCase()) + "</td>" +
            '<td><div class="pline">' + esc(m["Winner"]) + ' <span class="noc">' + esc(m["Winner NOC"]) + "</span></div>" +
            '<div class="pline"><span class="defw">def.</span> ' + esc(m["Loser"]) + ' <span class="noc">' + esc(m["Loser NOC"]) + "</span></div></td>" +
            '<td class="score">' + esc(S(m["Method"]).toUpperCase()) + " " + esc(m["Score"]) + "</td></tr>").join("") + "</table>";
          html += '<details class="entries"><summary>Full entry list (' + rows.length + ")</summary><ul>" +
            rows.map(r => '<li><span class="who">' + pic(r["Athlete"], r["NOC"], true) + esc(r["Athlete"]) + '</span><span class="noc">' + esc(r["NOC"]) + "</span>" + chip(r["Placement"]) + "</li>").join("") +
            "</ul></details></div>";
        }
        html += "</div>";
      });
      html += "</div>";
    }
    html += "</div>";
  }
  return html;
}

/* ---------------- render + events ---------------- */
function render() {
  document.getElementById("tab-search").className = tab === "search" ? "on" : "";
  document.getElementById("tab-academy").className = tab === "academy" ? "on" : "";
  document.getElementById("tab-events").className = tab === "events" ? "on" : "";
  const app = document.getElementById("app");
  app.innerHTML = tab === "search" ? renderSearch() : tab === "academy" ? renderAcademy() : renderEvents();
  const q = document.getElementById("q");
  if (q) {
    q.addEventListener("input", e => { query = e.target.value; render(); });
    q.focus();
    q.setSelectionRange(q.value.length, q.value.length);
  }
  app.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.getAttribute("data-toggle");
    openKeys.has(k) ? openKeys.delete(k) : openKeys.add(k);
    render();
  }));
  app.querySelectorAll("[data-export]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); exportAthlete(b.getAttribute("data-export")); }));
  app.querySelectorAll("[data-ptoggle]").forEach(sm => sm.addEventListener("click", () => {
    const k = sm.getAttribute("data-ptoggle");
    openKeys.has(k) ? openKeys.delete(k) : openKeys.add(k);   // remember open/closed across re-renders
  }));
  app.querySelectorAll("[data-ytoggle]").forEach(btn => btn.addEventListener("click", () => {
    const y = btn.getAttribute("data-ytoggle");
    closedYears.has(y) ? closedYears.delete(y) : closedYears.add(y);
    render();
  }));
}
document.getElementById("tab-search").addEventListener("click", () => { tab = "search"; render(); });
document.getElementById("tab-academy").addEventListener("click", () => { tab = "academy"; render(); });
document.getElementById("tab-events").addEventListener("click", () => { tab = "events"; render(); });
boot();
</script>
